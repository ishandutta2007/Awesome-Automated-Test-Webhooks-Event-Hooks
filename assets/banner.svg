<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
    <filter id="glowEmerald" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-18px) translateX(12px); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pingDot {
        0% { r: 4px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes beaconWave {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.2; }
      }

      .glow-orb-cyan {
        transform-origin: 200px 100px;
        animation: pulseGlow 6s ease-in-out infinite, floatOrb 9s ease-in-out infinite;
      }
      .glow-orb-purple {
        transform-origin: 1000px 300px;
        animation: pulseGlow 7s ease-in-out infinite reverse, floatOrb 11s ease-in-out infinite reverse;
      }
      .glow-orb-emerald {
        transform-origin: 600px 360px;
        animation: pulseGlow 5s ease-in-out infinite;
      }

      .pipeline-line {
        stroke-dasharray: 8 6;
        animation: flowData 4s linear infinite;
      }
      .pipeline-line-fast {
        stroke-dasharray: 6 6;
        animation: flowData 2.5s linear infinite;
      }

      .ping-pulse {
        animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .beacon {
        animation: beaconWave 2s ease-in-out infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Atmosphere Orbs (Background Layer) -->
  <g>
    <circle class="glow-orb-cyan" cx="220" cy="110" r="140" fill="#0284C7" filter="url(#glowCyan)"/>
    <circle class="glow-orb-purple" cx="980" cy="220" r="160" fill="#7C3AED" filter="url(#glowPurple)"/>
    <circle class="glow-orb-emerald" cx="600" cy="380" r="110" fill="#059669" filter="url(#glowEmerald)"/>
  </g>

  <!-- Decorative Outer Tech Border -->
  <rect x="16" y="16" width="1168" height="388" rx="16" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="22" y="22" width="1156" height="376" rx="12" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- Corner Tech Markers -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 1184 36 L 1184 16 L 1164 16" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 16 384 L 16 404 L 36 404" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 1184 384 L 1184 404 L 1164 404" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- ======================================================== -->
  <!-- DYNAMIC EVENT PIPELINE FLOW (Interactive Background Layer) -->
  <!-- ======================================================== -->
  <g transform="translate(0, 10)">
    <!-- Connection Paths -->
    <path d="M 280 340 L 450 340" fill="none" stroke="#334155" stroke-width="2" />
    <path class="pipeline-line" d="M 280 340 L 450 340" fill="none" stroke="#38BDF8" stroke-width="2.5" />

    <path d="M 690 340 L 860 340" fill="none" stroke="#334155" stroke-width="2" />
    <path class="pipeline-line-fast" d="M 690 340 L 860 340" fill="none" stroke="#34D399" stroke-width="2.5" />

    <!-- Node 1: Event Producer -->
    <g transform="translate(130, 316)">
      <rect width="150" height="48" rx="10" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="20" cy="24" r="6" fill="#38BDF8" />
      <circle class="ping-pulse" cx="20" cy="24" r="6" fill="#38BDF8" />
      <text x="36" y="22" fill="#E2E8F0" class="node-text">Event Source</text>
      <text x="36" y="36" fill="#94A3B8" font-size="9.5" font-family="-apple-system, sans-serif">POST /api/webhooks</text>
    </g>

    <!-- Node 2: Webhook Gateway & Ingestion -->
    <g transform="translate(450, 316)">
      <rect width="240" height="48" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" />
      <circle cx="22" cy="24" r="6" fill="#818CF8" />
      <circle class="beacon" cx="22" cy="24" r="10" fill="none" stroke="#818CF8" stroke-width="1.5" />
      <text x="38" y="22" fill="#FFFFFF" class="node-text">Webhook Gateway &amp; Engine</text>
      <text x="38" y="36" fill="#A5B4FC" font-size="9.5" font-family="-apple-system, sans-serif">Verification • Retries • Queue</text>
    </g>

    <!-- Node 3: Automated Test / Consumer -->
    <g transform="translate(860, 316)">
      <rect width="180" height="48" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" />
      <circle cx="20" cy="24" r="6" fill="#34D399" />
      <circle class="ping-pulse" cx="20" cy="24" r="6" fill="#34D399" />
      <text x="36" y="22" fill="#E2E8F0" class="node-text">Test Consumer / App</text>
      <text x="36" y="36" fill="#6EE7B7" font-size="9.5" font-family="-apple-system, sans-serif">HTTP 200 OK Verified</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND BRANDING & HEADER (High Priority Text Layer)  -->
  <!-- ======================================================== -->

  <!-- Top Pill / Category Tag -->
  <g transform="translate(455, 48)">
    <rect width="290" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="16" cy="14" r="4" fill="#38BDF8" class="beacon"/>
    <text x="28" y="18" fill="#38BDF8" class="pill-text">⚡ CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title Line 1 -->
  <text x="600" y="125" text-anchor="middle" fill="#FFFFFF" font-size="40" class="title-text">
    Awesome Automated Test Webhooks
  </text>

  <!-- Main Title Line 2 / Highlights -->
  <text x="600" y="172" text-anchor="middle" fill="url(#textGrad)" font-size="36" class="title-text">
    &amp; Event Hooks Ecosystem
  </text>

  <!-- Subtitle / Comprehensive Value Proposition -->
  <text x="600" y="212" text-anchor="middle" fill="#CBD5E1" font-size="15" class="subtitle-text">
    High-Reliability Webhook Delivery Infrastructure • Automated Testing • Inspection Tools • Event Gateways
  </text>

  <!-- Secondary Feature Pills (Foreground) -->
  <g transform="translate(185, 238)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="72" y="17" text-anchor="middle" fill="#93C5FD" class="pill-text">Delivery SLAs</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(160, 0)">
      <rect width="175" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="87" y="17" text-anchor="middle" fill="#C4B5FD" class="pill-text">HMAC Verification</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(350, 0)">
      <rect width="155" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="77" y="17" text-anchor="middle" fill="#6EE7B7" class="pill-text">Automated Retries</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(520, 0)">
      <rect width="165" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="82" y="17" text-anchor="middle" fill="#FDE047" class="pill-text">Local Debugging</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(700, 0)">
      <rect width="130" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" fill="#F472B6" class="pill-text">Open Source</text>
    </g>
  </g>
</svg>
