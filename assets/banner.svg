<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080C14"/><stop offset="50%" stop-color="#0D1527"/><stop offset="100%" stop-color="#070B12"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".8"/><stop offset="100%" stop-color="#0F172A" stop-opacity=".8"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#34D399"/></linearGradient><linearGradient id="nodeGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0369A1"/></linearGradient><linearGradient id="nodeGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient><linearGradient id="nodeGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient><filter id="glowCyan" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="35"/></filter><filter id="glowPurple" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><filter id="glowEmerald" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.12)}}@keyframes floatOrb{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(12px)}}@keyframes flowData{0%{stroke-dashoffset:240}}@keyframes pingDot{0%{r:4px;opacity:1}}@keyframes beaconWave{0%{opacity:.8}50%{opacity:.2}}.glow-orb-cyan{transform-origin:200px 100px;animation:pulseGlow 6s ease-in-out infinite,floatOrb 9s ease-in-out infinite}.glow-orb-purple{transform-origin:1000px 300px;animation:pulseGlow 7s ease-in-out infinite reverse,floatOrb 11s ease-in-out infinite reverse}.glow-orb-emerald{transform-origin:600px 360px;animation:pulseGlow 5s ease-in-out infinite}.pipeline-line{stroke-dasharray:8 6;animation:flowData 4s linear infinite}.pipeline-line-fast{stroke-dasharray:6 6;animation:flowData 2.5s linear infinite}.ping-pulse{animation:pingDot 2s cubic-bezier(0,0,.2,1) infinite}.beacon{animation:beaconWave 2s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.8px}.subtitle-text{font-weight:500}.node-text,.pill-text{font-size:11px;font-weight:600}.pill-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.node-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g><circle cx="220" cy="110" r="140" fill="#0284C7" class="glow-orb-cyan" filter="url(#glowCyan)"/><circle cx="980" cy="220" r="160" fill="#7C3AED" class="glow-orb-purple" filter="url(#glowPurple)"/><circle cx="600" cy="380" r="110" fill="#059669" class="glow-orb-emerald" filter="url(#glowEmerald)"/></g><rect width="1168" height="388" x="16" y="16" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.2" rx="16"/><rect width="1156" height="376" x="22" y="22" fill="none" stroke="#1E293B" stroke-opacity=".8" stroke-width=".8" rx="12"/><path fill="none" stroke="#38BDF8" stroke-width="2.5" d="M 16 36 L 16 16 L 36 16"/><path fill="none" stroke="#38BDF8" stroke-width="2.5" d="M 1184 36 L 1184 16 L 1164 16"/><path fill="none" stroke="#38BDF8" stroke-width="2.5" d="M 16 384 L 16 404 L 36 404"/><path fill="none" stroke="#38BDF8" stroke-width="2.5" d="M 1184 384 L 1184 404 L 1164 404"/><g><path fill="none" stroke="#334155" stroke-width="2" d="M 280 340 L 450 340" transform="translate(0, 10)"/><path fill="none" stroke="#38BDF8" stroke-width="2.5" d="M 280 340 L 450 340" class="pipeline-line" transform="translate(0, 10)"/><path fill="none" stroke="#334155" stroke-width="2" d="M 690 340 L 860 340" transform="translate(0, 10)"/><path fill="none" stroke="#34D399" stroke-width="2.5" d="M 690 340 L 860 340" class="pipeline-line-fast" transform="translate(0, 10)"/><g transform="translate(0, 10) translate(130, 316)"><rect width="150" height="48" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.5" rx="10"/><circle cx="20" cy="24" r="6" fill="#38BDF8"/><circle cx="20" cy="24" r="6" fill="#38BDF8" class="ping-pulse"/><text x="36" y="22" fill="#E2E8F0" class="node-text">Event Source</text><text x="36" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9.5">POST /api/webhooks</text></g><g transform="translate(0, 10) translate(450, 316)"><rect width="240" height="48" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" rx="10"/><circle cx="22" cy="24" r="6" fill="#818CF8"/><circle cx="22" cy="24" r="10" fill="none" stroke="#818CF8" stroke-width="1.5" class="beacon"/><text x="38" y="22" fill="#FFF" class="node-text">Webhook Gateway &amp; Engine</text><text x="38" y="36" fill="#A5B4FC" font-family="-apple-system, sans-serif" font-size="9.5">Verification • Retries • Queue</text></g><g transform="translate(0, 10) translate(860, 316)"><rect width="180" height="48" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" rx="10"/><circle cx="20" cy="24" r="6" fill="#34D399"/><circle cx="20" cy="24" r="6" fill="#34D399" class="ping-pulse"/><text x="36" y="22" fill="#E2E8F0" class="node-text">Test Consumer / App</text><text x="36" y="36" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="9.5">HTTP 200 OK Verified</text></g></g><g transform="translate(455, 48)"><rect width="290" height="28" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".8" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38BDF8" class="beacon"/><text x="28" y="18" fill="#38BDF8" class="pill-text">⚡ CURATED DEVELOPER DIRECTORY</text></g><text x="600" y="125" fill="#FFF" class="title-text" font-size="40" text-anchor="middle">Awesome Automated Test Webhooks</text><text x="600" y="172" fill="url(#textGrad)" class="title-text" font-size="36" text-anchor="middle">&amp; Event Hooks Ecosystem</text><text x="600" y="212" fill="#CBD5E1" class="subtitle-text" font-size="15" text-anchor="middle">High-Reliability Webhook Delivery Infrastructure • Automated Testing • Inspection Tools • Event Gateways</text><g><g transform="translate(185, 238) translate(0, 0)"><rect width="145" height="26" fill="#1E293B" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="13"/><text x="72" y="17" fill="#93C5FD" class="pill-text" text-anchor="middle">Delivery SLAs</text></g><g transform="translate(185, 238) translate(160, 0)"><rect width="175" height="26" fill="#1E293B" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="13"/><text x="87" y="17" fill="#C4B5FD" class="pill-text" text-anchor="middle">HMAC Verification</text></g><g transform="translate(185, 238) translate(350, 0)"><rect width="155" height="26" fill="#1E293B" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="13"/><text x="77" y="17" fill="#6EE7B7" class="pill-text" text-anchor="middle">Automated Retries</text></g><g transform="translate(185, 238) translate(520, 0)"><rect width="165" height="26" fill="#1E293B" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="13"/><text x="82" y="17" fill="#FDE047" class="pill-text" text-anchor="middle">Local Debugging</text></g><g transform="translate(185, 238) translate(700, 0)"><rect width="130" height="26" fill="#1E293B" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="13"/><text x="65" y="17" fill="#F472B6" class="pill-text" text-anchor="middle">Open Source</text></g></g></svg>